name: SixTONES news watch

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（GitHubの都合で数分遅れることあり）
  workflow_dispatch:          # 手動実行ボタン

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python watch.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: 既読番号を保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update last_id" && git push)
